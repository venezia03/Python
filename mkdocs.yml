site_name: Результаты исследований
site_description: Публикация результатов экспериментов
site_author: Dmitry Yaroslavov

theme:
  name: material
  language: ru
  features: 
    - navigation.tabs
    - navigation.sections
    - navigation.top 
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
 - Главная: index.md
 - Исследование: 
    - Сравнение генераторов: research/generators.md
 - Практика: 
    - CI/CD: practice/ci.md